<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111923"><meta name="description" content="A private two-person messenger prototype">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Nook Messenger</title>
  <style>
    :root{color-scheme:dark;--ink:#f1f5fb;--muted:#9aa9bc;--blue:#3d8ef2;--paper:#111923;--panel:#18222e;--line:#344254}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0c1118;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
    .app{width:100%;max-width:560px;height:100dvh;min-height:420px;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);box-shadow:0 10px 50px #0008}
    .brandbar{display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
    .brandmark{height:38px;width:38px;border-radius:13px;background:#20334a;color:var(--blue);display:grid;place-items:center}.brandmark svg{width:20px;height:20px}
    .brand{flex:1}.brand b{font-size:18px;letter-spacing:-.5px;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11px}
    button{font:inherit;border:0;cursor:pointer}.roundbtn{height:40px;width:40px;border:1px solid var(--line);border-radius:50%;background:#202b38;color:#9bb5d2;display:grid;place-items:center}.roundbtn svg{width:18px;height:18px}
    .profile{display:flex;align-items:center;gap:12px;margin:0;padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
    .avatar{height:46px;width:46px;flex:none;border-radius:50%;background:linear-gradient(145deg,#30445a,#233348);color:#ddeadf;display:grid;place-items:center;font-size:18px;font-weight:700}
    .person{flex:1;min-width:0}.person strong{font-size:16px}.person small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap}
    .dot{height:7px;width:7px;border-radius:50%;background:#e1a64f}.dot.online{background:#35c98a}
    .notice{display:flex;align-items:center;gap:10px;margin:9px 14px 5px;padding:8px 11px;border:1px solid #51412a;border-radius:12px;background:#30291f;flex:none}
    .lock{height:27px;width:27px;display:grid;place-items:center;flex:none;background:#44361f;border-radius:50%;color:#e4b86d}.lock svg{width:15px;height:15px}.noticetext{flex:1}.noticetext strong{display:block;color:#e5d2ac;font-size:11px}.noticetext small{display:block;color:#c7b48f;font-size:10px}
    .live{font-size:9px;letter-spacing:1px;font-weight:800;color:#e4b86d}.live.online{color:#65d7a1}
    .messages{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
    .day{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:10px;letter-spacing:1.1px;margin:2px 0 8px}.day:before,.day:after{content:"";width:30px;height:1px;background:#354455}
    .empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:25px}.emptyicon{width:70px;height:70px;border-radius:24px;background:#1c2e41;color:var(--blue);display:grid;place-items:center;margin:0 auto 16px}.emptyicon svg{width:30px;height:30px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
    .bubble{max-width:82%;padding:11px 15px;border-radius:18px 18px 18px 5px;background:#222e3b;color:var(--ink);overflow-wrap:anywhere;align-self:flex-start}
    .bubble.mine{align-self:flex-end;background:linear-gradient(160deg,#4299f5,#355fe2);border-radius:18px 18px 5px 18px}.time{display:block;color:#a8b8cc;font-size:10px;text-align:right;margin-top:4px}.bubble.mine .time{color:#d9e8ff}
    .attachment-card{display:block;min-width:180px;max-width:min(72vw,320px);margin-top:4px;padding:9px;border-radius:12px;background:#132235;color:var(--ink);text-decoration:none;overflow:hidden}.bubble.mine .attachment-card{background:#214f9f}.attachment-card img{display:block;max-width:100%;max-height:260px;margin:0 auto 8px;border-radius:8px;object-fit:contain}.attachment-card audio{width:100%;max-width:280px;margin-top:8px}.attachment-name{display:block;font-weight:650;font-size:13px;overflow-wrap:anywhere}.attachment-meta{display:block;color:#b6c8dc;font-size:10px;margin-top:3px}
    .composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex:none}
    .attach{height:39px;width:39px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}.attach svg{width:18px;height:18px}
    .inputwrap{flex:1;min-width:0;border:1px solid var(--line);background:#1a2532;border-radius:25px;padding:11px 16px}.inputwrap:focus-within{border-color:#468fe1;box-shadow:0 0 0 3px #3d8ef218}.inputwrap input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px}.inputwrap input::placeholder{color:var(--muted)}
    .send{height:46px;width:46px;flex:none;border-radius:50%;background:linear-gradient(160deg,#4299f5,#355fe2);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px #2455c044;transition:transform .15s}.send svg{width:18px;height:18px}.send:active{transform:scale(.94)}
    footer{font-size:10px;color:#8494a8;text-align:center;padding:0 10px 8px;background:var(--panel);flex:none}
    dialog{width:min(340px,calc(100vw - 36px));border:1px solid var(--line);border-radius:22px;padding:23px;background:var(--panel);color:var(--ink);box-shadow:0 20px 70px #0009}dialog::backdrop{background:#050a12aa;backdrop-filter:blur(3px)}dialog h2{font-size:19px;margin:0 0 8px}dialog p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 18px}dialog button{background:var(--blue);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600}
    @media(min-width:600px){body{padding:22px}.app{height:calc(100dvh - 44px);max-height:900px;border:1px solid var(--line);border-radius:25px;overflow:hidden;box-shadow:0 16px 55px #0008}}
  </style>
</head>
<body><main class="app">
  <header class="brandbar">
    <div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3.2A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></div>
    <div class="brand"><b>nook</b><small>A space for two</small></div>
    <button id="refresh" class="roundbtn" aria-label="Refresh messages" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg></button>
  </header>
  <section class="profile">
    <div class="avatar">M</div><div class="person"><strong>Mira</strong><small><span id="dot" class="dot"></span><span id="status">Connecting to laptop…</span></small></div>
    <button class="roundbtn" id="call" aria-label="Calls coming later" title="Calls coming later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 19a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 2.7a2 2 0 0 1-.6 1.8L7.2 10a16 16 0 0 0 6 6l1.8-1.8a2 2 0 0 1 1.8-.6l2.7.5a2 2 0 0 1 1.7 1.8Z"/></svg></button>
  </section>
  <div class="notice"><span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span class="noticetext"><strong>Prototype mode</strong><small>Messages are not encrypted</small></span><span id="live" class="live">WAIT</span></div>
  <section id="messages" class="messages" aria-live="polite"><div class="day">TODAY</div><div id="empty" class="empty"><div class="emptyicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3.2A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></div><strong>Your little corner</strong>Send a hello to start the conversation.</div></section>
  <form id="composer" class="composer"><button type="button" id="attach" class="attach" aria-label="Attach a file" title="Attach a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" id="photo" class="attach" aria-label="Attach an image" title="Attach an image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></button><div class="inputwrap"><input id="text" autocomplete="off" maxlength="4000" placeholder="Message" aria-label="Message"></div><button type="button" id="audio" class="attach" aria-label="Attach audio" title="Attach audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button><button class="send" aria-label="Send message" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
  <input id="filePicker" type="file" hidden><input id="imagePicker" type="file" accept="image/*" hidden><input id="audioPicker" type="file" accept="audio/*" hidden>
  <footer>Messages stay on your laptop while its server is running.</footer>
</main>
<dialog id="coming"><h2>Coming in a later step</h2><p>Calling and end-to-end encryption are not connected yet.</p><button id="closeDialog">Got it</button></dialog>
<script>
(()=>{
 const box=document.querySelector('#messages'), empty=document.querySelector('#empty'), status=document.querySelector('#status'), dot=document.querySelector('#dot'), live=document.querySelector('#live'), input=document.querySelector('#text'), coming=document.querySelector('#coming');
 const pickers={file:document.querySelector('#filePicker'),image:document.querySelector('#imagePicker'),audio:document.querySelector('#audioPicker')};
 const device=localStorage.getItem('nook-device-id')||crypto.randomUUID();localStorage.setItem('nook-device-id',device);
 const setStatus=(value,online=false)=>{status.textContent=value;dot.classList.toggle('online',online);live.textContent=online?'LIVE':'WAIT';live.classList.toggle('online',online)};
 const timeOf=(v)=>{try{return new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return ''}};
 const sizeLabel=n=>n<1024?`${n} B`:n<1048576?`${Math.round(n/1024)} KB`:`${(n/1048576).toFixed(1)} MB`;
 function renderAttachment(parent,a){const card=document.createElement('a');card.className='attachment-card';card.href=a.url;card.target='_blank';card.rel='noopener';if(a.mimeType?.startsWith('image/')){const img=document.createElement('img');img.src=a.url;img.alt=a.name;card.append(img)}const name=document.createElement('span');name.className='attachment-name';name.textContent=a.name;card.append(name);const meta=document.createElement('span');meta.className='attachment-meta';meta.textContent=`${a.mimeType||'file'} · ${sizeLabel(a.size||0)} · open`;card.append(meta);if(a.mimeType?.startsWith('audio/')){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=a.url;card.append(audio);card.addEventListener('click',e=>{if(e.target===audio||audio.contains(e.target))e.preventDefault()})}parent.append(card)}
 async function refresh(){try{const res=await fetch('/messages',{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();box.querySelectorAll('.bubble').forEach(x=>x.remove());empty.hidden=data.messages.length>0;for(const m of data.messages){const node=document.createElement('div');node.className='bubble'+(m.senderDeviceId===device?' mine':'');if(m.text){const textNode=document.createElement('div');textNode.textContent=m.text;node.append(textNode)}if(m.attachment)renderAttachment(node,m.attachment);const time=document.createElement('span');time.className='time';time.textContent=timeOf(m.createdAt);node.append(time);box.append(node)}box.scrollTop=box.scrollHeight;setStatus('Laptop server connected',true)}catch{setStatus('Server not reachable · check Wi-Fi')}}
 async function sendFile(file){if(!file)return;if(file.size>12*1024*1024){setStatus('Choose a file under 12 MB');return}setStatus('Uploading attachment…');try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const uploaded=await fetch('/attachments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senderDeviceId:device,name:file.name,mimeType:file.type||'application/octet-stream',data})});if(!uploaded.ok)throw Error();const result=await uploaded.json();const sent=await fetch('/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senderDeviceId:device,text:'',attachment:result.attachment})});if(!sent.ok)throw Error();await refresh()}catch{setStatus('Upload failed · check server and Wi-Fi')}}
 document.querySelector('#refresh').addEventListener('click',refresh);document.querySelector('#attach').addEventListener('click',()=>pickers.file.click());document.querySelector('#photo').addEventListener('click',()=>pickers.image.click());document.querySelector('#audio').addEventListener('click',()=>pickers.audio.click());Object.values(pickers).forEach(p=>p.addEventListener('change',()=>{sendFile(p.files?.[0]);p.value=''}));document.querySelector('#call').addEventListener('click',()=>coming.showModal());document.querySelector('#closeDialog').addEventListener('click',()=>coming.close());
 document.querySelector('#composer').addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value)return;input.value='';try{const res=await fetch('/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senderDeviceId:device,text:value})});if(!res.ok)throw Error();await refresh()}catch{input.value=value;setStatus('Send failed · check server and Wi-Fi')}});
 refresh();setInterval(refresh,3000);
})();
</script></body></html>
